[project]
name = "cs2-rop"
version = "0.1.0"
description = "Counter-Strike 2 Round Outcome Predictor"
readme = "README.md"
authors = [
    { name = "Augustas Markevičius" },
    { name = "Petras Radžiūnas" },
    { name = "Titas Burinskas" },
    { name = "Tomas Giedraitis" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "awpy==3.1.1",
]

[dependency-groups]
dev = [
    "black[jupyter]>=26.10.1",
    "gdown>=6.1,<7",
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "pandas[parquet]>=3.0.6",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
